version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: climate360-postgres
    environment:
      POSTGRES_USER: climate360
      POSTGRES_PASSWORD: climate360pass
      POSTGRES_DB: climate360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climate360"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - climate360-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climate360-backend
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      CONDUIT_API_KEY: ${CONDUIT_API_KEY}
      CONDUIT_EMAIL: ${CONDUIT_EMAIL}
      CONDUIT_API_URL: ${CONDUIT_API_URL}
      DATABASE_URL: postgresql://climate360:climate360pass@postgres:5432/climate360
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - climate360-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climate360-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    networks:
      - climate360-network

volumes:
  postgres_data:

networks:
  climate360-network:
    driver: bridge
